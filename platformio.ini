; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Targets:
;   denky32 — ESP32 CYD (ST7796 SPI + XPT2046), the v0.x production board.
;   mm1_p4  — Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 (ST7701 MIPI-DSI + GT911), v1.0.0 target.
;
; Compile um env de cada vez: `pio run -e denky32` OU `pio run -e mm1_p4`.
; Os dois platforms disputam os mesmos nomes de pacote, então `-e denky32 -e mm1_p4`
; na mesma invocação falha no segundo. Detalhes em docs/ESP32_P4_PORT.md.

[platformio]
default_envs = denky32

[common]
build_flags =
	-I include
	-I src
	-D LV_CONF_INCLUDE_SIMPLE
	-D CORE_DEBUG_LEVEL=0
	-D BT_DEVICE_NAME=\"SAP6_0001\"

; ─────────────────────────────────────────────────────────────────────────────
; ESP32 CYD 4" (ST7796 480×320 + XPT2046) — released firmware target
; ─────────────────────────────────────────────────────────────────────────────
[env:denky32]
; Pinned: the pioarduino fork used by env:mm1_p4 also registers itself as
; "espressif32", so an unpinned platform here would silently jump to Arduino
; core 3.x and break this build (ledcSetup, String→std::string, ...).
platform = espressif32@6.13.0
; Idem para o esptool: o fork instala uma versão nova sob o mesmo nome de pacote.
platform_packages =
	platformio/tool-esptoolpy@~1.40501.0
board = denky32
framework = arduino
monitor_speed = 115200
; O bring-up da P4 vive em src/board/p4/ e não compila para o ESP32 clássico.
build_src_filter =
	+<*>
	-<board/>
; Upload mais rápido após a 1.ª gravação (ajuste se falhar: 460800 ou 115200).
upload_speed = 921600
; huge_app.csv gives 3 MB for the app (instead of default 1.25 MB).
; The ESP32 CYD has a 4 MB flash chip, so this fits fine.
board_build.partitions = huge_app.csv
; TFT_eSPI: TOUCH_CS must live in libdeps TFT_eSPI/User_Setup.h — pre-script copies include/User_Setup.h each build.
; TFT_eSPI: TOUCH_CS tem de estar em libdeps/.../TFT_eSPI/User_Setup.h — o pre-script copia include/User_Setup.h em cada build.
extra_scripts =
	pre:scripts/pio_tft_setup_copy.py
	pre:scripts/pio_firmware_version.py
	; SAP6 uses BLE GATT (not classic SPP DistoX):
	; pre:scripts/pio_bt_spp_channel1.py
	; pre:scripts/pio_bt_iocap_none.py
; LZR_SHARE_USB_UART=1: laser no mesmo UART0 do conector USB/CH340 (RXD0=GPIO3, TXD0=GPIO1), 9600 8N1.
; Se RX bytes = 0: testar -DLZR_SWAP_RXTX=1 ou conferir TX do módulo -> RX da placa (GPIO3).
; Para UART separada: -DLZR_SHARE_USB_UART=0 -DLZR_PIN_RX=22 -DLZR_PIN_TX=21
; Azimute: default no main.cpp = declinação WMM ~2025 Belo Horizonte (−21.7 °, norte geográfico aprox.).
; Outra cidade: -DAZIMUTH_OFFSET_DEG=...  |  Só norte magnético (bússola): -DAZIMUTH_OFFSET_DEG=0
; Após ajuste na SETUP o valor fica na NVS e passa a mandar sobre o macro.
; Display: original rotation 1. Default TFT_ROTATION=0 (−90°). Upside-down fix: -DTFT_ROTATION=3 (+180°).
; SAP6 BLE (CaveBLE): nome no scan (prefixo SAP6_ obrigatorio no TopoDroid). -DBT_DEVICE_NAME='"SAP6_0001"'
build_flags =
	${common.build_flags}
	-D MM1_BOARD_CYD=1
	-D TFT_ROTATION=0
	-D LZR_SHARE_USB_UART=1
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^8.3.11
	adafruit/Adafruit BNO08x

; Teste laser a 115200 (comum em módulos TTL): acrescente uma linha em build_flags acima:
;	-D LZR_BAUD=115200

; ─────────────────────────────────────────────────────────────────────────────
; Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 (ST7701 MIPI-DSI 480×800 + GT911)
;
; O platform oficial da PlatformIO não suporta ESP32-P4; usamos o fork pioarduino.
; Rádio (Wi-Fi 6 / BLE 5) vem do ESP32-C6-MINI via SDIO (ESP-Hosted) — ver docs/ESP32_P4_PORT.md.
; Se a placa trouxer silício ES (pré rev.300), troque para:
;   board_build.chip_variant = esp32p4_es
;   board_build.f_cpu = 360000000L
; ─────────────────────────────────────────────────────────────────────────────
[env:mm1_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = mm1_p4
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_mm1_p4.csv
extra_scripts =
	pre:scripts/pio_firmware_version.py
; App MM1 + HAL P4. Bring-up demo e rádio nativo ficam de fora (C6/ESP-Hosted depois).
build_src_filter =
	+<*>
	-<board/>
	+<board/p4/>
	-<board/p4/p4_bringup.cpp>
	-<sap6_ble.cpp>
	-<web_portal.cpp>
build_flags =
	${common.build_flags}
	-I src/board/p4
	-D MM1_BOARD_P4=1
; Pinned to git tags on purpose: the PlatformIO registry mirror of
; ESP32_Display_Panel is stale (it still ships the pre-1.0 ESP_Panel_Conf API,
; which has no MIPI-DSI/board-conf support) despite carrying a higher version.
lib_deps =
	lvgl/lvgl@^8.3.11
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
; Wire must not be linked: i2c_master (ng) and Display_Panel's legacy driver/i2c.h
; cannot coexist in one image (IDF aborts at board begin). IMU waits for SH-2 on legacy I2C.
lib_ignore =
	Wire
