name: mm1-experiment
services:
  experiment:
    image: kinova-geomagic-noetic:demo
    build:
      context: ../kinova-geomagic-noetic-demo
      dockerfile: Dockerfile
    network_mode: host
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      QT_X11_NO_MITSHM: "1"
      HOME: /tmp/mm1-home
      XDG_RUNTIME_DIR: /tmp/mm1-runtime
      ROS_HOME: /tmp/mm1-ros
      LAB_HOST: "${LAB_HOST:-}"
      LAB_PORT: "${LAB_PORT:-5000}"
      LAB_TIMEOUT: "${LAB_TIMEOUT:-5}"
    volumes:
      - ..:/mm1:ro
      - ../kinova-geomagic-noetic-demo/catkin_ws/src/kinova_geomagic_demo:/catkin_ws/src/kinova_geomagic_demo:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    entrypoint: ["bash", "/mm1/docker/experiment-entrypoint.sh"]
    command: ["python3", "/mm1/docker/scripts/experiment.py", "--output-dir", "/data"]
    stdin_open: true
    tty: true
